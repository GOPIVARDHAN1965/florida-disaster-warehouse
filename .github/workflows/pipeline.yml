name: pipeline
on:
  schedule:
    - cron: "0 10 * * 1"  # Mondays 10:00 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Full refresh (ignore incremental watermarks)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: restore previous raw snapshot
        run: |
          if gh release download data-latest -p raw.tar.gz; then tar -xzf raw.tar.gz && rm raw.tar.gz; else echo "no snapshot yet"; fi

      - name: extract
        run: |
          # first week of the month: full refresh, so rows FEMA deleted upstream drop out
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%d)" -le 7 ]; then
            uv run python extract/openfema.py --full
          else
            uv run python extract/openfema.py
          fi
          uv run python extract/reference.py

      - run: make transform model export docs

      - name: publish raw snapshot
        run: |
          tar -czf raw.tar.gz data/raw
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest raw data snapshot" --notes "Raw Parquet + incremental watermarks, replaced by every pipeline run."
          gh release upload data-latest raw.tar.gz --clobber

      - name: commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json model/metrics.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
